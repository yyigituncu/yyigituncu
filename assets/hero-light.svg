<svg viewBox="0 0 880 210" width="880" height="210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sami Yiğit Uncu — Backend ve Bilgisayarlı Görü">
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#eff3f7" />
    </linearGradient>
    <radialGradient id="glow-light" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.06" />
      <stop offset="55%" stop-color="#0969da" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0969da" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="frame-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.90" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="879" height="209" rx="12" fill="url(#bg-grad-light)" stroke="#d0d7de" stroke-width="1" />
  <rect x="1" y="1" width="878" height="208" rx="11.5" fill="url(#glow-light)" />
  <line x1="24" y1="1" x2="856" y2="1" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1" />

  <!-- Subtle architectural dot matrix -->
  <g fill="#d0d7de" opacity="0.88">
    <circle cx="604" cy="34" r="1" /> <circle cx="624" cy="34" r="1" /> <circle cx="644" cy="34" r="1" /> <circle cx="664" cy="34" r="1" /> <circle cx="684" cy="34" r="1" />
    <circle cx="604" cy="54" r="1" /> <circle cx="624" cy="54" r="1" /> <circle cx="644" cy="54" r="1" /> <circle cx="664" cy="54" r="1" /> <circle cx="684" cy="54" r="1" />
    <circle cx="604" cy="74" r="1" /> <circle cx="624" cy="74" r="1" /> <circle cx="644" cy="74" r="1" /> <circle cx="664" cy="74" r="1" /> <circle cx="684" cy="74" r="1" />
    <circle cx="604" cy="94" r="1" /> <circle cx="624" cy="94" r="1" /> <circle cx="644" cy="94" r="1" /> <circle cx="664" cy="94" r="1" /> <circle cx="684" cy="94" r="1" />
    <circle cx="604" cy="114" r="1" /> <circle cx="624" cy="114" r="1" /> <circle cx="644" cy="114" r="1" />
  </g>

  <!-- Right motif: Vision + API card -->
  <g>
    <rect x="644" y="44" width="188" height="122" rx="10" fill="url(#frame-grad-light)" stroke="#d0d7de" stroke-width="1" />
    <circle cx="660" cy="58" r="2" fill="#afb8c1" />
    <circle cx="670" cy="58" r="2" fill="#afb8c1" />
    <circle cx="680" cy="58" r="2" fill="#afb8c1" />
    <text x="818" y="61" text-anchor="end" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="0.8">CV // API</text>
    <line x1="644" y1="71" x2="832" y2="71" stroke="#e1e4e8" stroke-width="1" />

    <!-- Detection frame -->
    <rect x="662" y="84" width="66" height="62" rx="4" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1" />
    <g stroke="#0969da" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M668 96 V90 H674" />
      <path d="M716 90 H722 V96" />
      <path d="M668 134 V140 H674" />
      <path d="M716 140 H722 V134" />
    </g>
    <line x1="690" y1="115" x2="700" y2="115" stroke="#0969da" stroke-opacity="0.35" stroke-width="1" />
    <line x1="695" y1="110" x2="695" y2="120" stroke="#0969da" stroke-opacity="0.35" stroke-width="1" />

    <!-- Structured API lines -->
    <rect x="742" y="92" width="72" height="6" rx="3" fill="#0969da" fill-opacity="0.55" />
    <rect x="742" y="107" width="56" height="5" rx="2.5" fill="#6e7781" fill-opacity="0.35" />
    <rect x="742" y="120" width="68" height="5" rx="2.5" fill="#6e7781" fill-opacity="0.24" />
    <rect x="742" y="133" width="44" height="5" rx="2.5" fill="#6e7781" fill-opacity="0.16" />
  </g>

  <!-- Left Typography -->
  <circle cx="49" cy="49" r="6" fill="#0969da" fill-opacity="0.14" />
  <circle cx="49" cy="49" r="3" fill="#0969da" />
  <text x="63" y="53" fill="#59636e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.5">BACKEND &amp; BİLGİSAYARLI GÖRÜ</text>

  <text x="44" y="98" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="35" font-weight="600" letter-spacing="-0.7">Sami Yiğit Uncu</text>
  <text x="44" y="129" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">.NET Core ile backend mimarileri, Python ile edge görüntü işleme.</text>

  <!-- Minimal stack chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#24292f">
    <rect x="44" y="152" width="84" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <text x="86" y="167.5" text-anchor="middle">C# · .NET</text>

    <rect x="136" y="152" width="110" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <text x="191" y="167.5" text-anchor="middle">Python · YOLO</text>

    <rect x="254" y="152" width="112" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <text x="310" y="167.5" text-anchor="middle">OpenCV · ONNX</text>

    <rect x="374" y="152" width="106" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
    <text x="427" y="167.5" text-anchor="middle">Raspberry Pi</text>
  </g>
</svg>
